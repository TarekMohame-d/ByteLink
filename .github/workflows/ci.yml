name: Backend CI

on:
  pull_request:
    branches:
      - develop
      - main

  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Packages.props
            Directory.Build.props

      - name: Restore
        run: dotnet restore ByteLink.slnx

      - name: Build
        run: |
          dotnet build ByteLink.slnx \
            --configuration Release \
            --no-restore

      - name: Run Unit Tests
        shell: bash
        run: |
          set -euo pipefail
          while read -r project; do
            echo "::group::Running $project"
            dotnet test "$project" \
              --configuration Release \
              --no-build \
              --verbosity normal \
              --logger GitHubActions
            echo "::endgroup::"
          done < <(find src/backend -name "*.Unit.Tests.csproj")

      - name: Run Integration Tests
        shell: bash
        run: |
          set -euo pipefail
          while read -r project; do
            echo "::group::Running $project"
            dotnet test "$project" \
              --configuration Release \
              --no-build \
              --verbosity normal \
              --logger GitHubActions
            echo "::endgroup::"
          done < <(find src/backend -name "*.Integration.Tests.csproj")
