name: CI

on:
  pull_request:
    branches: [main, develop]

jobs:
  test-backend:
    name: Test Backend (.NET)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore Dependencies
        run: dotnet restore ByteLink.slnx

      - name: Build Solution
        run: dotnet build ByteLink.slnx --no-restore -c Release

      - name: Run Tests
        run: dotnet test ByteLink.slnx --no-build -c Release --verbosity normal

  test-frontend:
    name: Test & Lint Frontend (React)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('src/client/app/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm --prefix src/client/app install --frozen-lockfile

      - name: Run Biome Check
        run: pnpm --prefix src/client/app exec biome check .

      - name: Type Check
        run: pnpm --prefix src/client/app run build
