name: bytelink

networks:
  internal:
    driver: bridge

services:
  postgres:
    image: postgres:18.4
    restart: unless-stopped
    pull_policy: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_ADMIN_USER}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    ports:
      - "100.64.0.1:5432:5432"
    volumes:
      - /srv/data/bytelink/postgres:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_ADMIN_USER} -d ${DB_DATABASE}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  valkey:
    image: valkey/valkey:9.1
    restart: unless-stopped
    pull_policy: always
    ports:
      - "100.64.0.1:6379:6379"
    volumes:
      - /srv/data/bytelink/valkey:/data
    healthcheck:
      test: [ "CMD", "valkey-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  seq:
    image: datalust/seq:2025.2
    restart: unless-stopped
    pull_policy: always
    env_file:
      - .env
    environment:
      ACCEPT_EULA: "Y"
      SEQ_PASSWORD: ${SEQ_PASSWORD}
    ports:
      - "100.64.0.1:5341:80"
    volumes:
      - /srv/data/bytelink/seq:/data
    networks:
      - internal

  migrator:
    image: ghcr.io/tarekmohame-d/bytelink/migrator:latest
    restart: "no"
    pull_policy: always
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  backend:
    image: ghcr.io/tarekmohame-d/bytelink/backend:latest
    restart: unless-stopped
    pull_policy: always
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    stop_grace_period: 30s
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - internal

  frontend:
    image: ghcr.io/tarekmohame-d/bytelink/frontend:latest
    restart: unless-stopped
    pull_policy: always
    depends_on:
      backend:
        condition: service_healthy
    stop_grace_period: 15s
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - internal
