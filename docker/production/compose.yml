name: bytelink

networks:
  internal:
    driver: bridge

services:

  postgres:
    image: postgres:18.4
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_ADMIN_USER}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      - /srv/data/bytelink/postgres:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_ADMIN_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  valkey:
    image: valkey/valkey:9.1
    restart: unless-stopped
    volumes:
      - /srv/data/bytelink/valkey:/data
    expose:
      - "6379"
    networks:
      - internal

  seq:
    image: datalust/seq:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ACCEPT_EULA: Y
      SEQ_PASSWORD: ${SEQ_PASSWORD}
    volumes:
      - /srv/data/bytelink/seq:/data
    expose:
      - "80"
    networks:
      - internal

  migrator:
    image: ghcr.io/YOUR_USERNAME/bytelink-migrator:latest
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - internal

  backend:
    image: ghcr.io/YOUR_USERNAME/bytelink-api:latest
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_started

    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - internal

  frontend:
    image: ghcr.io/YOUR_USERNAME/bytelink-web:latest
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - internal
